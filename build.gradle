plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.cableguard'

base {
    archivesName = 'cableguard'
}

java {
    withSourcesJar()
}

neoForge {
    version = '21.1.262'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        cableguard {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'Create: Cable Guard',
                'Implementation-Version': project.version
        )
    }
}
